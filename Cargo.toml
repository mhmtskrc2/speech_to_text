[package]
name = "whisper_gui"
version = "0.1.1"
edition = "2024"
description = "MP3 URL'sinden metin çıkaran, whisper.cpp tabanlı masaüstü uygulaması"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
# eframe'in varsayılanları kapalı: wgpu yerine daha geniş uyumlu glow kullanılıyor.
# Geri kalan varsayılanlar tek tek açık — özellikle `clipboard` olmadan kopyala /
# yapıştır hiç derlenmez ve `system_fonts` olmadan, gömülü fontta bulunmayan
# karakterler (çıktı metni her dilden gelebilir) boş kutu olarak çizilir.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rfd = "0.17.2"
rubato = "5.0.1"
sha2 = "0.10"
symphonia = { version = "0.6.1", features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
ureq = "3.5.0"
whisper-rs = "0.16.0"

# macOS'ta Metal her zaman açıktır — ayrı bir bayrak gerektirmez. Metal
# gölgelendiricileri ikiliye gömüldüğü için yanında dosya taşımak da gerekmez,
# ve bir makinede Metal başlatılamazsa whisper.cpp kendiliğinden CPU'ya düşer.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[features]
default = []
# Windows/Linux için GPU hızlandırma. Derleme zamanında CUDA toolkit ya da
# Vulkan SDK gerektirdiğinden, dağıtılan paketlerde açık değildir.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }

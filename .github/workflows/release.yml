name: Release

# Bir `v*` etiketi atıldığında (veya elle tetiklendiğinde) Rust kurulu olmayan
# makinelerde doğrudan çalışan paketler üretip GitHub Release'e yükler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Paketlerin yükleneceği etiket (örn. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release'i oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release zaten var; paketler üzerine yazılacak."
          else
            gh release create "$TAG" \
              --title "Sesten Metne $TAG" \
              --notes-file .github/release-notes.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tek bir Apple Silicon runner'da her iki mimari de derlenip `lipo`
          # ile birleştirilir: Intel runner'ları (macos-13) emekliye ayrıldı ve
          # istendiğinde iş sıra bulamadan iptal oluyor.
          - name: macOS (universal)
            os: macos-latest
            target: aarch64-apple-darwin
            # Metal bayrak gerektirmez; macOS hedeflerinde Cargo.toml'den gelir.
            features: ""
            asset: sesten-metne-macos
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            asset: Sesten-Metne.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust araç zincirini hazırla
        shell: bash
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add x86_64-apple-darwin
          fi
          rustc --version

      - name: Vulkan SDK kur (Windows GPU derlemesi için)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress | Out-Null
          }
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          # Gölgelendiriciler derleme zamanında glslc ile derlendiği için SDK
          # gerekir; çalışma zamanında yalnızca sürücüyle gelen vulkan-1.dll.
          Start-Process -FilePath .\vulkan_sdk.exe -Wait -NoNewWindow `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending)[0].FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VULKAN_SDK = $sdk"

      - name: Derle
        shell: bash
        run: |
          set -euo pipefail
          # Düz değişken kullanılıyor: macOS'un bash 3.2'sinde `set -u` altında
          # boş bir dizinin "${arr[@]}" açılımı hata verir.
          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then
            FEATURES="--features ${{ matrix.features }}"
          fi
          cargo build --release --locked --target "${{ matrix.target }}" $FEATURES

          if [ "${{ runner.os }}" = "macOS" ]; then
            # Intel dilimi de Metal ile derlenir; macOS 11+ çalıştıran her Mac
            # Metal destekler ve başlatılamazsa whisper.cpp CPU'ya düşer.
            cargo build --release --locked --target x86_64-apple-darwin
          fi

      - name: Paketle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Tek dosya isteniyor, bu yüzden `.app` paketi yok: iki mimari tek
          # evrensel ikilide birleştirilip olduğu gibi yükleniyor.
          lipo -create -output "${{ matrix.asset }}" \
            "target/${{ matrix.target }}/release/whisper_gui" \
            "target/x86_64-apple-darwin/release/whisper_gui"
          chmod +x "${{ matrix.asset }}"
          lipo -info "${{ matrix.asset }}"

      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "target/${{ matrix.target }}/release/whisper_gui.exe" "${{ matrix.asset }}"

      # GPU sürümü ayrı bir dosya: Vulkan derlemesi vulkan-1.dll'e yükleme
      # zamanında bağlanır, yani ekran kartı sürücüsü olmayan makinelerde
      # açılmaz. Tek bir ikili ikisini birden karşılayamıyor.
      #
      # `continue-on-error`: bu adım GPU'ya özgü bir derleme sorunu yüzünden
      # düşerse çalışan CPU sürümü yine de yayımlanmalı. Aksi hâlde isteğe
      # bağlı bir ek, asıl indirmeyi de götürüyor.
      - name: GPU sürümünü derle (Windows, Vulkan)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ggml, gölgelendirici üreticisini iç içe ayrı bir CMake projesi
          # olarak kurar. Visual Studio üreteciyle o iç proje, MSBuild'in özel
          # derleme adımı içinde çalıştığı için derleyiciyi tanıyamıyor:
          # "No CMAKE_C_COMPILER could be found". Ninja üreteci bu katmanı
          # ortadan kaldırıyor; iç proje de cl.exe'yi ortamdan buluyor, bu
          # yüzden her şey vcvars64 ortamında çalıştırılıyor.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat bulunamadı: $vcvars" }

          $env:CMAKE_GENERATOR = "Ninja"

          # Kısa bir derleme dizini: ggml'in iç içe projesi
          # vulkan-shaders-gen-prefix\src\vulkan-shaders-gen-build\... diye
          # derinleştiği için PDB yolu Windows'un 260 karakter sınırını aşıyor
          # ve cl.exe "C1041: cannot open program database" veriyor.
          $env:CARGO_TARGET_DIR = "C:\g"

          # Komutlar bir .bat dosyasına yazılıyor: `cmd /c "<dize>"`, dize
          # tırnakla başladığında ilk ve son tırnağı kırpıyor ve zinciri sessizce
          # bozuyor. Önceki denemede komutlar hiç çalışmadığı hâlde çıkış kodu 0
          # döndü ve eski ikili "GPU sürümü" diye kopyalandı.
          $bat = @"
          @echo on
          call "$vcvars"
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          where ninja
          if errorlevel 1 exit /b 1
          cargo build --release --locked --target ${{ matrix.target }} --features vulkan
          "@
          Set-Content -Path build-gpu.bat -Value $bat -Encoding ascii
          cmd /c build-gpu.bat
          if ($LASTEXITCODE -ne 0) { throw "Vulkan derlemesi başarısız: $LASTEXITCODE" }

          Copy-Item "$env:CARGO_TARGET_DIR/${{ matrix.target }}/release/whisper_gui.exe" `
                    "Sesten-Metne-GPU.exe"

          # Derlemenin gerçekten farklı bir ikili ürettiğini doğrula. Sessizce
          # atlanmış bir derleme, CPU ikilisinin kopyasını "GPU sürümü" diye
          # yayımlamaya yol açıyordu; bu kontrol onu imkânsız kılar.
          $cpu = (Get-FileHash "${{ matrix.asset }}").Hash
          $gpu = (Get-FileHash "Sesten-Metne-GPU.exe").Hash
          if ($cpu -eq $gpu) {
            Remove-Item "Sesten-Metne-GPU.exe"
            throw "GPU ikilisi CPU ikilisiyle birebir aynı: Vulkan derlemesi gerçekleşmemiş"
          }
          Write-Host "GPU ikilisi CPU'dan farklı, Vulkan derlemesi gerçekleşti."

      # Duman testi: pencere açılamaz ama komut satırı modu tüm boru hattını
      # (whisper.cpp dahil) yükler, yani bozuk bir ikili burada yakalanır.
      - name: Paket çalışıyor mu (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Boru yok: kapanan bir boru testin kendi yan etkisi olurdu.
          "./${{ matrix.asset }}" --list-models > /dev/null

      - name: Paket çalışıyor mu (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Sürüm derlemesi konsolsuz olduğu için çıktı değil, çıkış kodu denetlenir.
          $p = Start-Process -FilePath "${{ matrix.asset }}" `
                             -ArgumentList "--list-models" `
                             -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            throw "beklenmeyen çıkış kodu: $($p.ExitCode)"
          }

          # GPU sürümü yalnızca bilgi amaçlı denenir: runner'larda ekran kartı
          # sürücüsü yok, dolayısıyla vulkan-1.dll de yok. Burada çalışmaması
          # beklenen bir sonuç, derlemeyi düşürmemeli.
          if (Test-Path "Sesten-Metne-GPU.exe") {
            try {
              $g = Start-Process -FilePath "Sesten-Metne-GPU.exe" `
                                 -ArgumentList "--list-models" `
                                 -Wait -PassThru -NoNewWindow
              Write-Host "GPU sürümü çıkış kodu (runner'da GPU yok): $($g.ExitCode)"
            } catch {
              Write-Host "GPU sürümü runner'da başlatılamadı (beklenen): $_"
            }
          } else {
            Write-Host "GPU sürümü üretilmedi; yalnızca CPU sürümü yayımlanacak."
          }

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILES=("${{ matrix.asset }}")
          # GPU sürümü isteğe bağlı: üretilemediyse sessizce atlanır.
          if [ -f "Sesten-Metne-GPU.exe" ]; then
            FILES+=("Sesten-Metne-GPU.exe")
          fi
          echo "yüklenecek: ${FILES[*]}"
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "${FILES[@]}" --clobber
